<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pictures fixture</title>
    <style>
      section {
        font-family: Arial, sans-serif;
        font-size: 24px;
        line-height: 1.2;
        color: #111827;
      }
      img,
      svg,
      .frame {
        position: absolute;
        display: block;
      }
      .plain {
        left: 40px;
        top: 40px;
        width: 320px;
        height: 200px;
      }
      .cover {
        left: 400px;
        top: 40px;
        width: 200px;
        height: 200px;
        object-fit: cover;
      }
      .contain {
        left: 640px;
        top: 40px;
        width: 200px;
        height: 200px;
        object-fit: contain;
        object-position: left top;
      }
      .clipped {
        left: 880px;
        top: 40px;
        width: 320px;
        height: 200px;
        clip-path: inset(20px 40px 60px 80px);
      }
      .jpeg {
        left: 40px;
        top: 300px;
        width: 160px;
        height: 100px;
        border: 4px solid #000000;
        border-radius: 12px;
        box-sizing: border-box;
      }
      .webp {
        left: 240px;
        top: 300px;
        width: 160px;
        height: 100px;
        opacity: 0.5;
      }
      .gif {
        left: 440px;
        top: 300px;
        width: 40px;
        height: 40px;
      }
      .svgfile {
        left: 520px;
        top: 300px;
        width: 80px;
        height: 80px;
      }
      .inline {
        left: 640px;
        top: 300px;
        width: 80px;
        height: 80px;
      }
      .missing {
        left: 760px;
        top: 300px;
        width: 40px;
        height: 40px;
      }
      .rotated {
        left: 840px;
        top: 300px;
        width: 160px;
        height: 100px;
        transform: rotate(90deg);
      }
    </style>
  </head>
  <body>
    <section id="slide-1">
      <img class="plain" src="assets/quad.png" alt="quad" />
      <img class="cover" src="assets/quad.png" alt="" />
      <img class="contain" src="assets/quad.png" alt="" />
      <img class="clipped" src="assets/quad.png" alt="" />
      <img class="jpeg" src="assets/quad.jpg" alt="" />
      <img class="webp" src="assets/quad.webp" alt="" />
      <img class="gif" src="assets/tiny.gif" alt="" />
      <img class="svgfile" src="assets/icon.svg" alt="" />
      <svg class="inline" viewBox="0 0 10 10"><rect width="10" height="10" fill="#0ea5e9" /></svg>
      <img class="missing" src="assets/nope.png" alt="" />
      <img class="rotated" src="assets/quad.png" alt="" />
    </section>
  </body>
</html>
