<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tables fixture</title>
    <style>
      section {
        font-family: Arial, sans-serif;
        font-size: 20px;
        line-height: 1.2;
        color: #111827;
      }
      table {
        position: absolute;
        left: 40px;
        top: 40px;
        width: 600px;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 12px;
        border: 1px solid #94a3b8;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #e2e8f0;
        font-weight: 700;
      }
      td.num {
        text-align: right;
        vertical-align: bottom;
      }
      tr.total td {
        border-top: 3px solid #0f172a;
        background: #fef3c7;
      }
      .tall {
        height: 80px;
      }
      .bad {
        position: absolute;
        left: 40px;
        top: 400px;
      }
      .caption {
        position: absolute;
        left: 700px;
        top: 40px;
        width: 300px;
      }
      .caption caption {
        text-align: left;
        padding: 4px 0;
      }
      .caption td {
        border: 0;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <section id="slide-1">
      <table class="grid">
        <thead>
          <tr><th>Item</th><th>Qty</th><th class="num">Price</th></tr>
        </thead>
        <tbody>
          <tr><td rowspan="2">Widget <strong>A</strong></td><td>1</td><td class="num">10.00</td></tr>
          <tr><td>2</td><td class="num">20.00</td></tr>
          <tr class="tall"><td colspan="2"><p>Merged cell</p><ul><li>with a list</li></ul></td><td class="num">30.00</td></tr>
          <tr class="total"><td colspan="2">Total</td><td class="num">60.00</td></tr>
        </tbody>
      </table>
      <table class="caption">
        <caption>Figure 1</caption>
        <tr><td>a</td><td>b</td></tr>
      </table>
      <table class="bad">
        <tr><td><div>block inside</div></td></tr>
      </table>
    </section>
  </body>
</html>
