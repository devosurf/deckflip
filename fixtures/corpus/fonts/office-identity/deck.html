<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Office font identity</title>
  <style>
    @font-face { font-family: Heebo; font-weight: 500; src: url('../_assets/heebo/Heebo-Medium.ttf'); }
    @font-face { font-family: Heebo; font-weight: 700; src: url('../_assets/heebo/Heebo-Bold.ttf'); }
    @font-face { font-family: Heebo; font-weight: 800; src: url('../_assets/heebo/Heebo-ExtraBold.ttf'); }
    @font-face { font-family: 'Brand Text'; font-weight: 400; font-style: normal; src: url('../_assets/source-sans-3/SourceSans3-Regular.ttf'); }
    @font-face { font-family: 'Brand Text'; font-weight: 700; font-style: normal; src: url('../_assets/source-sans-3/SourceSans3-Bold.ttf'); }
    @font-face { font-family: 'Brand Text'; font-weight: 400; font-style: italic; src: url('../_assets/source-sans-3/SourceSans3-It.ttf'); }
    @font-face { font-family: 'Brand Text'; font-weight: 700; font-style: italic; src: url('../_assets/source-sans-3/SourceSans3-BoldIt.ttf'); }
    section { font-family: Heebo; font-size: 32px; line-height: 48px; }
    p { position: absolute; left: 80px; margin: 0; }
  </style>
</head>
<body>
  <section>
    <p style="top: 80px; font-weight: 500">Heebo Medium editable</p>
    <p style="top: 160px; font-weight: 700">Heebo Bold editable</p>
    <p style="top: 240px; font-weight: 800">Heebo ExtraBold editable</p>
    <p style="top: 320px; font-family: 'Brand Text'; font-weight: 400">Source Sans Regular editable</p>
    <p style="top: 400px; font-family: 'Brand Text'; font-weight: 700">Source Sans Bold editable</p>
    <p style="top: 480px; font-family: 'Brand Text'; font-weight: 400; font-style: italic">Source Sans Italic editable</p>
    <p style="top: 560px; font-family: 'Brand Text'; font-weight: 700; font-style: italic">Source Sans Bold Italic editable</p>
  </section>
</body>
</html>
