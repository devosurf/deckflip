<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="deckflip:canvas" content="1280x720">
<title>fit</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: Arial; }
  body > section { position: relative; box-sizing: border-box; overflow: hidden; }
  .label { position: absolute; left: 80px; top: 40px; margin: 0; font-size: 22px; line-height: 30px; color: #111827; }
  img { position: absolute; display: block; }
  .cover { left: 80px; top: 100px; width: 240px; height: 240px; object-fit: cover; }
  .cover-top { left: 380px; top: 100px; width: 240px; height: 240px; object-fit: cover; object-position: 100% 0; }
  .contain { left: 680px; top: 100px; width: 240px; height: 240px; object-fit: contain; }
  .contain-bottom { left: 980px; top: 100px; width: 240px; height: 240px; object-fit: contain; object-position: center bottom; }
  .none { left: 80px; top: 400px; width: 240px; height: 240px; object-fit: none; }
  .clip { left: 380px; top: 400px; width: 320px; height: 200px; clip-path: inset(20px 40px 60px 80px); }
  .clip-pct { left: 780px; top: 400px; width: 320px; height: 200px; clip-path: inset(10% 25%); }
  .rotated { left: 1120px; top: 420px; width: 160px; height: 100px; transform: rotate(-20deg); object-fit: cover; }
</style>
</head>
<body>
<section>
  <p class="label">object-fit, object-position, clip-path inset, rotation</p>
  <img class="cover" src="../_assets/scene.png" alt="">
  <img class="cover-top" src="../_assets/scene.png" alt="">
  <img class="contain" src="../_assets/scene.png" alt="">
  <img class="contain-bottom" src="../_assets/scene.png" alt="">
  <img class="none" src="../_assets/scene.png" alt="">
  <img class="clip" src="../_assets/scene.png" alt="">
  <img class="clip-pct" src="../_assets/scene.png" alt="">
  <img class="rotated" src="../_assets/scene.png" alt="">
</section>
</body>
</html>
