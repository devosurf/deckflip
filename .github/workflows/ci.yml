name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CI: 'true'
  SOURCE_DATE_EPOCH: '1704164645'

jobs:
  macos:
    # macOS is the supported host; keep all automated gates here. PowerPoint remains a manual oracle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Install LibreOffice and PowerPoint-compatible fonts
        run: brew install --cask libreoffice font-liberation font-carlito font-caladea
      - name: Install managed Chromium
        run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run typecheck
      - run: npm test
      - name: 'Determinism: two conversions of the skill template are byte-identical'
        run: |
          npx tsx src/cli/main.ts convert skills/deckflip/templates/deck.html -o /tmp/first.pptx --offline --strict
          npx tsx src/cli/main.ts convert skills/deckflip/templates/deck.html -o /tmp/second.pptx --offline --strict
          cmp /tmp/first.pptx /tmp/second.pptx
      - run: npm run build
      - run: npm pack --dry-run
